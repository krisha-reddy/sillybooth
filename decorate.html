<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Decorate Your Image</title>
    <link rel="stylesheet" href="decorate.css">
</head>

<body>
    <header class="app-header">
        <!--logo display-->
        <img src="Assets/sillybooth.svg" alt="sillybooth-logo" class="site-logo"/>
    </header>

    <div class="decorate-page">
        <div class="photo-stage">
            <div class="polaroid-frame">
                <img id="finalPhoto" class="polaroid-photo"/>
            </div>
        </div>

        <div class="sticker-tray-column">
            <img src="Assets/click-to-add-sticker-btn.svg" alt="Click to Add Sticker!" class="tray-label"/>

        <div class="stickerTray">

            <div class="stickerGrid">
                <div class="sticker-slot">
                    <img src="Assets/Stickers/cat-sticker.svg" alt="Cat Sticker" class="sticker-icon"/>
                </div>

                <div class="sticker-slot">
                    <img src="Assets/Stickers/doodle-crown-sticker.svg" alt="Crown Doodle Sticker" class="sticker-icon"/>
                </div>

                <div class="sticker-slot">
                    <img src="Assets/Stickers/spiral-doodle-sticker.svg" alt="Spiral Doodle Sticker" class="sticker-icon"/>
                </div>

                <div class="sticker-slot">
                    <img src="Assets/Stickers/smiley-sticker.svg" alt="Smiley Sticker" class="sticker-icon"/>
                </div>

                <div class="sticker-slot">
                    <img src="Assets/Stickers/glasses-sticker.svg" alt="Glasses Sticker" class="sticker-icon"/>
                </div>

                <div class="sticker-slot">
                    <div class="sticker-placeholder">
                    </div>
                </div>

                <div class="sticker-slot">
                    <div class="sticker-placeholder">
                    </div>
                </div>

                <div class="sticker-slot">
                    <div class="sticker-placeholder">
                    </div>
                </div>

                <div class="sticker-slot">
                    <div class="sticker-placeholder">
                    </div>
                </div>

                <div class="sticker-slot">
                    <div class="sticker-placeholder">
                    </div>
                </div>

                
            </div>
        </div>
        </div>
         
    </div>
        
    </div>
</body>

<script src="decorate.js"></script>

</html>
